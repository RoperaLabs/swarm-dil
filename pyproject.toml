[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-dil"
version = "0.3.0"
description = "Coordination and communication of memory- and bandwidth-limited UAV teams over degraded (DIL) links"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ropera Labs" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]

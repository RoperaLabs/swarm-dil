[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-dil"
version = "0.1.0"
description = "UAV swarm area search under disconnected, intermittent and limited (DIL) links"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ropera Labs" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7"]
